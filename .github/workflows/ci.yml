name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  checks:
    name: Lint, formato, typecheck y tests unitarios
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Formato
        run: pnpm format:check

      - name: Typecheck
        run: pnpm typecheck

      - name: Migraciones al día con db/schema.ts
        run: |
          pnpm db:generate
          if [ -n "$(git status --porcelain supabase/migrations)" ]; then
            echo "::error::db/schema.ts cambió sin migración. Corre pnpm db:generate y sube el archivo."
            git status --porcelain supabase/migrations
            exit 1
          fi

      - name: Tests unitarios
        run: pnpm test

  e2e:
    name: Build y tests e2e
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Postgres, Auth, Storage y Mailpit en Docker; aplica supabase/migrations
      # al iniciar y crea los buckets de supabase/config.toml.
      - name: Levantar Supabase local
        run: |
          pnpm exec supabase start -x studio,postgres-meta
          pnpm exec supabase seed buckets --local

      - name: Variables de entorno de Supabase local
        run: |
          status="$(pnpm exec supabase status -o json)"
          {
            echo "NEXT_PUBLIC_SITE_URL=http://localhost:3000"
            echo "NEXT_PUBLIC_SUPABASE_URL=$(jq -r .API_URL <<< "$status")"
            echo "NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY=$(jq -r .PUBLISHABLE_KEY <<< "$status")"
            echo "SUPABASE_SECRET_KEY=$(jq -r .SECRET_KEY <<< "$status")"
            echo "DATABASE_URL=$(jq -r .DB_URL <<< "$status")"
            echo "MAILPIT_URL=$(jq -r .MAILPIT_URL <<< "$status")"
            echo "AUTH_GOOGLE_ENABLED=false"
            echo "CRON_SECRET=$(openssl rand -hex 32)"
            echo "MOCK_PROVIDER_LATENCY_MS=2000"
          } >> "$GITHUB_ENV"

      # Concurrencia real de la billetera (PGlite no puede probarla).
      - name: Tests de integración
        run: pnpm test:integration

      - name: Build
        run: pnpm build

      - name: Instalar navegadores de Playwright
        run: pnpm exec playwright install --with-deps chromium

      - name: Tests e2e
        run: pnpm test:e2e

      - uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
